name: Generate BuildStream CI config
description: Write BuildStream cache configuration for runner-side assembly.

inputs:
  enable-push:
    description: Push artifacts and sources to the remote cache. Set false for fetch-only jobs (e.g. publish).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Generate BuildStream CI config
      shell: bash
      env:
        ENABLE_PUSH: ${{ inputs.enable-push }}
      run: |
        mkdir -p logs

        echo "${CASD_CLIENT_CERT:-}" > client.crt
        echo "${CASD_CLIENT_KEY:-}" > client.key

        cat > buildstream-ci.conf <<'BSTCONF'
        scheduler:
          on-error: continue
          fetchers: 32
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs
        BSTCONF

        cat >> buildstream-ci.conf <<'BSTCONFBUILD'
        build:
          retry-failed: True
          max-jobs: 1
        BSTCONFBUILD

        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          PUSH_FLAG="true"
          [[ "${ENABLE_PUSH:-true}" == "false" ]] && PUSH_FLAG="false"
          cat >> buildstream-ci.conf <<BSTCONFCACHE
        artifacts:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: ${PUSH_FLAG}
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        source-caches:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: ${PUSH_FLAG}
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        BSTCONFCACHE

        # Write the unified cache configuration block to avoid duplicate keys.
        cat >> buildstream-ci.conf <<'BSTCONFCACHEBLOCK'

        cache:
          cache-buildtrees: never
        BSTCONFCACHEBLOCK

        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          if [[ "${ENABLE_PUSH:-true}" == "true" ]]; then
            cat >> buildstream-ci.conf <<'BSTCONFSTORAGE'
          storage-service:
            url: https://cache.projectbluefin.io:11002
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
        BSTCONFSTORAGE
          fi
        fi

        cp buildstream-ci.conf logs/buildstream-ci.conf
        echo "=== BuildStream CI config ==="
        cat buildstream-ci.conf

        # Always generate a push-only config for the post-build artifact push step.
        # push: true so bst artifact push can write; no storage-service so casd
        # stays local and there is no sustained gRPC stream during the push phase.
        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          cat > buildstream-push.conf <<'BSTCONFPUSH'
        scheduler:
          on-error: continue
          fetchers: 16
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs

        build:
          retry-failed: True

        cache:
          cache-buildtrees: never

        artifacts:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: true
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        BSTCONFPUSH
          cp buildstream-push.conf logs/buildstream-push.conf
          echo "=== BuildStream push config ==="
          cat buildstream-push.conf
        fi
