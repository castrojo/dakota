name: Generate BuildStream CI config
description: Write BuildStream CI config for the runner-based Dakota workflow.

inputs:
  enable-remote-execution:
    description: Retained for compatibility; Dakota uses the GitHub runner for builds and cache.projectbluefin.io for artifact/source caches.
    required: true
  enable-push:
    description: Push artifacts and sources to the remote cache. Set false for build jobs.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Generate BuildStream CI config
      shell: bash
      env:
        ENABLE_REMOTE_EXECUTION: ${{ inputs.enable-remote-execution }}
        ENABLE_PUSH: ${{ inputs.enable-push }}
      run: |
        set -euo pipefail
        WORKSPACE_ROOT="${GITHUB_WORKSPACE:-$PWD}"
        mkdir -p "$WORKSPACE_ROOT/logs"

        if [[ "${ENABLE_REMOTE_EXECUTION:-false}" == "true" ]]; then
          echo "::error::Dakota CI uses the GitHub runner for the BuildStream build; remote execution is intentionally disabled."
          exit 1
        fi

        printf '%s\n' "${CASD_CLIENT_CERT:-}" > "$WORKSPACE_ROOT/client.crt"
        printf '%s\n' "${CASD_CLIENT_KEY:-}" > "$WORKSPACE_ROOT/client.key"

        cat > "$WORKSPACE_ROOT/buildstream-ci.conf" <<'BSTCONF'
        scheduler:
          on-error: continue
          fetchers: 32
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs
        BSTCONF

        cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<'BSTCONFBUILD'
        build:
          retry-failed: True
          max-jobs: 1
        BSTCONFBUILD

        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          PUSH_FLAG="true"
          [[ "${ENABLE_PUSH:-true}" == "false" ]] && PUSH_FLAG="false"
          cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<BSTCONFCACHE
        artifacts:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: ${PUSH_FLAG}
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        source-caches:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: ${PUSH_FLAG}
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
        BSTCONFCACHE
        fi

        cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<'BSTCONFCACHEBLOCK'

        cache:
          cache-buildtrees: never
        BSTCONFCACHEBLOCK

        if ! grep -Eq '^[[:space:]]*max-jobs:[[:space:]]*1[[:space:]]*$' "$WORKSPACE_ROOT/buildstream-ci.conf"; then
          echo "::error::buildstream-ci.conf is missing build.max-jobs: 1; the runner-based Dakota build requires this cap."
          exit 1
        fi

        cp "$WORKSPACE_ROOT/buildstream-ci.conf" "$WORKSPACE_ROOT/logs/buildstream-ci.conf"
        echo "Remote execution enabled: no"
        echo "=== BuildStream CI config ==="
        cat "$WORKSPACE_ROOT/buildstream-ci.conf"

        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          cat > "$WORKSPACE_ROOT/buildstream-push.conf" <<'BSTCONFPUSH'
        scheduler:
          on-error: continue
          fetchers: 16
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs

        build:
          retry-failed: True
          max-jobs: 1

        cache:
          cache-buildtrees: never

        artifacts:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: true
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        BSTCONFPUSH
          cp "$WORKSPACE_ROOT/buildstream-push.conf" "$WORKSPACE_ROOT/logs/buildstream-push.conf"
          echo "=== BuildStream push config ==="
          cat "$WORKSPACE_ROOT/buildstream-push.conf"
        fi
