# Runner-only build + publish pipeline for dakota:testing.
#
# Purpose: publish :testing entirely on GitHub-hosted runners when the remote
# execution / CAS infrastructure (cache.projectbluefin.io) is unavailable.
# build.yml hard-codes remote execution for the full build; when the RE
# backend is down, BST hangs silently and the stall watchdog kills it. This
# workflow builds the full graph locally on runners instead, carrying the
# BuildStream cache across a chain of jobs via workflow artifacts (the same
# transport pattern build.yml uses for warmup-shard handoff).
#
# Design:
#   seed (webkit | rest, parallel)  — cold-start shard builds (mirror of
#                                     build.yml warmup shards, RE off)
#   link 1..6 (max-parallel: 1)     — each resumes the full oci/bluefin.bst
#                                     build from the previous link's cache
#                                     artifact; on completion uploads a
#                                     per-SHA done marker and later links
#                                     short-circuit
#   publish                          — export, chunka, lint, push :SHA, sign
#   boot-check                       — QEMU boot gate (copied from publish.yml)
#   promote                          — skopeo copy :SHA -> :testing
#
# Resume across dispatches: cache artifacts are looked up by name across runs
# via the Actions artifacts API, so if 6 links are not enough, dispatching the
# workflow again continues from the newest surviving cache artifact.
#
# NOTE: :testing published by this workflow will NOT pass the stable-promotion
# cosign identity check in execute-release.yml (anchored to publish.yml).
# That is acceptable for emergency :testing publication; stable promotion
# requires a normal publish.yml run once the RE backend returns.

name: Publish Local dakota

on:
  workflow_dispatch:

env:
  IMAGE_NAME: dakota
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_FLAGS: -o x86_64_v3 true --no-interactive --config /src/buildstream-ci.conf

# Join build.yml's global group: only one BST build of any kind at a time.
concurrency:
  group: dakota-bst-build-global
  cancel-in-progress: false

jobs:
  # ── Seed shards (parallel cold start) ───────────────────────────────────
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [webkit, rest]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Skip seeding when a done marker or any link cache already exists —
      # links resume from those instead.
      - name: Check for existing progress
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skip=false
          done_count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=bst-done-${GITHUB_SHA}&per_page=1" \
            --jq '[.artifacts[] | select(.expired==false)] | length' || echo 0)
          link_count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired==false) | select(.name|startswith("bst-cache-link-"))] | length' || echo 0)
          if [ "${done_count}" -gt 0 ] || [ "${link_count}" -gt 0 ]; then skip=true; fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "==> seed skip=${skip}"

      - name: Setup runner
        if: steps.check.outputs.skip != 'true'
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          install-tools: '["just"]'

      # Same spanned btrfs volume as build.yml's full build: the graph
      # exceeds free space on / alone.
      - name: Provision BST cache volume
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo truncate -s 40G /home/runner/bst-cache-0.img
          sudo truncate -s 55G /mnt/bst-cache-1.img
          DEV0=$(sudo losetup --find --show /home/runner/bst-cache-0.img)
          DEV1=$(sudo losetup --find --show /mnt/bst-cache-1.img)
          sudo mkfs.btrfs -q -d single -m single "$DEV0" "$DEV1"
          sudo btrfs device scan
          mkdir -p "$HOME/.cache/buildstream"
          sudo mount -o compress-force=zstd:2,noatime "$DEV0" "$HOME/.cache/buildstream"
          sudo chown "$(id -u):$(id -g)" "$HOME/.cache/buildstream"
          df -h "$HOME/.cache/buildstream"

      # Best-effort L1 warm start from build.yml's warmup cache entries.
      - name: Restore BST workspace cache (L1, best effort)
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream
            !~/.cache/buildstream/buildtrees
            !~/.cache/buildstream/logs
          key: bst-warm-x86_64-${{ github.ref_name }}-${{ matrix.shard }}-${{ hashFiles('elements/freedesktop-sdk.bst', 'elements/gnome-build-meta.bst', 'patches/**', 'project.conf', 'include/**') }}-${{ github.run_id }}
          restore-keys: |
            bst-warm-x86_64-${{ github.ref_name }}-${{ matrix.shard }}-${{ hashFiles('elements/freedesktop-sdk.bst', 'elements/gnome-build-meta.bst', 'patches/**', 'project.conf', 'include/**') }}-
            bst-warm-x86_64-${{ github.ref_name }}-${{ matrix.shard }}-
            bst-warm-x86_64-${{ matrix.shard }}-
            bst-warm-x86_64-

      - name: Generate BuildStream CI config
        if: steps.check.outputs.skip != 'true'
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      # Step-level timeout so the pack/upload handoff below still runs on
      # timeout (monotonic seeding — same rationale as build.yml).
      - name: Build seed shard
        if: steps.check.outputs.skip != 'true'
        timeout-minutes: 280
        run: just warmup-shard ${{ matrix.shard }}

      - name: Pack BST cache
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/buildstream/_transport"
          tar --zstd -C "$HOME" \
            --exclude=.cache/buildstream/logs \
            --exclude=.cache/buildstream/buildtrees \
            --exclude=.cache/buildstream/_transport \
            -cf "$HOME/.cache/buildstream/_transport/bst-cache.tar.zst" .cache/buildstream
          ls -lh "$HOME/.cache/buildstream/_transport/"

      - name: Upload BST cache artifact
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bst-local-cache-seed-${{ matrix.shard }}
          path: ~/.cache/buildstream/_transport/bst-cache.tar.zst
          retention-days: 2
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-local-seed-logs-${{ matrix.shard }}-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # ── Sequential build links ─────────────────────────────────────────────
  link:
    needs: [seed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        link: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check done marker
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=bst-done-${GITHUB_SHA}&per_page=1" \
            --jq '[.artifacts[] | select(.expired==false)] | length' || echo 0)
          if [ "${count}" -gt 0 ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "==> build already complete for ${GITHUB_SHA}; link ${{ matrix.link }} is a no-op"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup runner
        if: steps.state.outputs.done != 'true'
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          install-tools: '["just"]'

      - name: Provision BST cache volume
        if: steps.state.outputs.done != 'true'
        run: |
          set -euo pipefail
          sudo truncate -s 40G /home/runner/bst-cache-0.img
          sudo truncate -s 55G /mnt/bst-cache-1.img
          DEV0=$(sudo losetup --find --show /home/runner/bst-cache-0.img)
          DEV1=$(sudo losetup --find --show /mnt/bst-cache-1.img)
          sudo mkfs.btrfs -q -d single -m single "$DEV0" "$DEV1"
          sudo btrfs device scan
          mkdir -p "$HOME/.cache/buildstream"
          sudo mount -o compress-force=zstd:2,noatime "$DEV0" "$HOME/.cache/buildstream"
          sudo chown "$(id -u):$(id -g)" "$HOME/.cache/buildstream"
          df -h "$HOME/.cache/buildstream"

      # Resume from the newest link cache; on the first link, merge both
      # seed shard caches (CAS is content-addressed — overlay extract is
      # a valid merge). Lookup is cross-run so a fresh dispatch resumes
      # from a previous run's artifacts.
      - name: Fetch newest BST cache artifact
        if: steps.state.outputs.done != 'true'
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Exact-name lookup for seeds; prefix lookup for link caches
          # (link cache names are unique per run+link because artifact
          # names are immutable within a run).
          newest_exact() {
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty' \
              2>/dev/null || true
          }
          newest_prefix() {
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired==false) | select(.name|startswith(\"$1\"))] | sort_by(.created_at) | last | .id // empty" \
              2>/dev/null || true
          }
          fetch_and_extract() {
            local id="$1"
            local zip="$HOME/.cache/buildstream/_transport/dl.zip"
            mkdir -p "$HOME/.cache/buildstream/_transport"
            echo "==> downloading artifact ${id}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
            # Stream tar.zst out of the (stored) zip — avoids double disk use.
            python3 -c "
          import zipfile, sys, shutil
          z = zipfile.ZipFile('$zip')
          shutil.copyfileobj(z.open(z.namelist()[0]), sys.stdout.buffer, 1 << 20)
          " | tar --zstd -x -C "$HOME"
            rm -f "$zip"
          }
          found=false
          link_id=$(newest_prefix "bst-cache-link-")
          if [ -n "${link_id}" ]; then
            fetch_and_extract "${link_id}"
            found=true
          else
            for shard in webkit rest; do
              sid=$(newest_exact "bst-local-cache-seed-${shard}")
              if [ -n "${sid}" ]; then
                fetch_and_extract "${sid}"
                found=true
              fi
            done
          fi
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          df -h "$HOME/.cache/buildstream"

      - name: Generate BuildStream CI config
        if: steps.state.outputs.done != 'true'
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      # The step never fails: partial progress must be packed and uploaded
      # regardless (monotonic chain). Completion is signalled via the done
      # marker artifact; the publish job gates on it.
      - name: Build oci/bluefin.bst (link ${{ matrix.link }})
        if: steps.state.outputs.done != 'true'
        id: build
        timeout-minutes: 250
        run: |
          set -uo pipefail
          rc=0
          just bst build oci/bluefin.bst || rc=$?
          echo "==> bst build exit code: ${rc}"
          if [ "${rc}" -eq 0 ]; then
            echo "${GITHUB_SHA}" > /tmp/bst-done-marker
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload done marker
        if: steps.build.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bst-done-${{ github.sha }}
          path: /tmp/bst-done-marker
          retention-days: 2
          if-no-files-found: error

      - name: Pack BST cache
        if: ${{ !cancelled() && steps.state.outputs.done != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/buildstream/_transport"
          rm -f "$HOME/.cache/buildstream/_transport/bst-cache.tar.zst"
          tar --zstd -C "$HOME" \
            --exclude=.cache/buildstream/logs \
            --exclude=.cache/buildstream/buildtrees \
            --exclude=.cache/buildstream/_transport \
            -cf "$HOME/.cache/buildstream/_transport/bst-cache.tar.zst" .cache/buildstream
          ls -lh "$HOME/.cache/buildstream/_transport/"

      # Unique name per run+link (artifact names are immutable within a
      # run); the fetch step selects the newest by created_at across the
      # "bst-cache-link-" prefix.
      - name: Upload BST cache artifact
        if: ${{ !cancelled() && steps.state.outputs.done != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bst-cache-link-${{ github.run_id }}-${{ matrix.link }}
          path: ~/.cache/buildstream/_transport/bst-cache.tar.zst
          retention-days: 2
          if-no-files-found: error
          compression-level: 0

      # Keep only the two newest link caches — best effort.
      - name: Prune old cache artifacts
        if: ${{ !cancelled() && steps.state.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired==false) | select(.name|startswith("bst-cache-link-"))] | sort_by(.created_at) | reverse | .[2:] | .[].id' \
            | while read -r id; do
                echo "pruning artifact ${id}"
                gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
              done
          exit 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-local-link-${{ matrix.link }}-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # ── Export, lint, push :SHA, sign ───────────────────────────────────────
  publish:
    needs: [link]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Require done marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=bst-done-${GITHUB_SHA}&per_page=1" \
            --jq '[.artifacts[] | select(.expired==false)] | length')
          if [ "${count}" -eq 0 ]; then
            echo "::error::build graph not complete after all links. Cache artifacts are preserved — dispatch 'Publish Local dakota' again to continue from where this run stopped."
            exit 1
          fi

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          install-tools: '["just"]'

      - name: Provision BST cache volume
        run: |
          set -euo pipefail
          sudo truncate -s 40G /home/runner/bst-cache-0.img
          sudo truncate -s 55G /mnt/bst-cache-1.img
          DEV0=$(sudo losetup --find --show /home/runner/bst-cache-0.img)
          DEV1=$(sudo losetup --find --show /mnt/bst-cache-1.img)
          sudo mkfs.btrfs -q -d single -m single "$DEV0" "$DEV1"
          sudo btrfs device scan
          mkdir -p "$HOME/.cache/buildstream"
          sudo mount -o compress-force=zstd:2,noatime "$DEV0" "$HOME/.cache/buildstream"
          sudo chown "$(id -u):$(id -g)" "$HOME/.cache/buildstream"

      - name: Fetch newest BST cache artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired==false) | select(.name|startswith("bst-cache-link-"))] | sort_by(.created_at) | last | .id // empty')
          [ -n "${id}" ] || { echo "::error::no bst-cache-link artifact found"; exit 1; }
          zip="$HOME/.cache/buildstream/_transport/dl.zip"
          mkdir -p "$HOME/.cache/buildstream/_transport"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
          python3 -c "
          import zipfile, sys, shutil
          z = zipfile.ZipFile('$zip')
          shutil.copyfileobj(z.open(z.namelist()[0]), sys.stdout.buffer, 1 << 20)
          " | tar --zstd -x -C "$HOME"
          rm -f "$zip"
          df -h "$HOME/.cache/buildstream"

      - name: Generate BST local config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      - name: Export OCI image from BuildStream
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest
        run: just export default

      - name: Chunkify image layers
        uses: projectbluefin/actions/bootc-build/chunka@v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:latest
          max-layers: "120"
          xattr-manifest: files/fakecap-manifest.tsv

      - name: Validate with bootc container lint
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: just lint

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin
          mkdir -p ~/.docker
          echo "$GH_TOKEN" | podman login ghcr.io --username "$GH_ACTOR" --password-stdin \
            --compat-auth-file ~/.docker/config.json

      - name: Push :${{ github.sha }} to GHCR
        id: push
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          sudo podman tag "localhost/${{ env.IMAGE_NAME }}:latest" "${IMAGE}:${GITHUB_SHA}"
          PUSH_OK=false
          for attempt in 1 2 3; do
            sudo podman push --compression-format=zstd \
              --digestfile /tmp/digest.txt \
              "${IMAGE}:${GITHUB_SHA}" && { PUSH_OK=true; break; }
            echo "Push attempt ${attempt} failed, retrying in 5s..."
            [ "$attempt" -lt 3 ] && sleep 5
          done
          $PUSH_OK || { echo "ERROR: all push attempts failed"; exit 1; }
          echo "digest=$(cat /tmp/digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Sign image and create attestation
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          generate-sbom: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Boot check (hard gate) — mirror of publish.yml boot-check ───────────
  boot-check:
    name: Boot check — gate
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Install image to disk via bootc
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          fallocate -l 30G disk.raw
          sudo podman run --rm --privileged --pid=host --ipc=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev \
            -v /var/lib/containers:/var/lib/containers \
            -v "$(pwd):/data" \
            "${IMAGE}" bootc install to-disk \
              --via-loopback /data/disk.raw \
              --filesystem ext4 \
              --bootloader none \
              --wipe \
            || { rc=$?; echo "bootc install exited ${rc} — checking whether the deployment was written"; }
          sudo podman rmi "${IMAGE}" 2>/dev/null || true
          LOOP=$(sudo losetup -f --show -P disk.raw)
          echo "BOOT_CHECK_LOOP=${LOOP}" >> "$GITHUB_ENV"
          sudo udevadm settle --timeout=30 2>/dev/null || true
          if ! sudo blkid "${LOOP}p3" &>/dev/null; then
            echo "ERROR: bootc install did not create a filesystem on ${LOOP}p3"
            sudo fdisk -l "${LOOP}" 2>&1 || true
            exit 1
          fi

      - name: Extract kernel, initramfs, root UUID and ostree path
        id: disk
        run: |
          set -euo pipefail
          LOOP="${BOOT_CHECK_LOOP}"
          if [ -z "${LOOP}" ] || ! sudo losetup "${LOOP}" &>/dev/null; then
            LOOP=$(sudo losetup -f --show -P disk.raw)
            sudo udevadm settle --timeout=10 2>/dev/null || true
          fi
          echo "Loop: ${LOOP}"
          ROOT_PART="${LOOP}p3"
          sudo mount "${ROOT_PART}" /mnt
          ROOT_UUID=$(sudo blkid -s UUID -o value "${ROOT_PART}")
          echo "root=${ROOT_PART}  uuid=${ROOT_UUID}"

          DEPLOY=$(sudo ls /mnt/ostree/deploy/default/deploy/ 2>/dev/null | head -1)
          [[ -z "${DEPLOY}" ]] && { echo "ERROR: ostree deployment missing"; exit 1; }
          DEP="/mnt/ostree/deploy/default/deploy/${DEPLOY}"
          VAR="/mnt/ostree/deploy/default/var"
          echo "deploy=${DEPLOY}"

          OSTREE_PATH=$(sudo find /mnt/ostree/boot.1/default -mindepth 2 -maxdepth 2 \
            2>/dev/null | sort | head -1 | sed 's|^/mnt||')
          if [[ -z "${OSTREE_PATH}" ]]; then
            echo "DEBUG: boot.1 tree:"
            sudo find /mnt/ostree/boot.1 -maxdepth 4 2>/dev/null || echo "  (empty or missing)"
            echo "ERROR: could not find OSTREE_PATH in /ostree/boot.1"; exit 1
          fi
          echo "ostree_path=${OSTREE_PATH}"

          KVER=""
          for kv in $(sudo ls "${DEP}/usr/lib/modules/" 2>/dev/null); do
            if [[ -f "${DEP}/usr/lib/modules/${kv}/vmlinuz" ]]; then
              KVER="${kv}"; break
            fi
          done
          [[ -z "${KVER}" ]] && { echo "ERROR: no vmlinuz found in deployment"; exit 1; }
          echo "kver=${KVER}"

          sudo cp "${DEP}/usr/lib/modules/${KVER}/vmlinuz" ./vmlinuz
          sudo cp "${DEP}/usr/lib/modules/${KVER}/initramfs.img" ./initramfs.img
          sudo chmod 644 vmlinuz initramfs.img

          {
            echo "ROOT_UUID=${ROOT_UUID}"
            echo "OSTREE_PATH=${OSTREE_PATH}"
            echo "KVER=${KVER}"
            echo "DEP=${DEP}"
            echo "VAR=${VAR}"
            echo "LOOP=${LOOP}"
          } >> "$GITHUB_OUTPUT"

      - name: Inject SSH key into deployment
        env:
          ROOT_UUID:   ${{ steps.disk.outputs.ROOT_UUID }}
          OSTREE_PATH: ${{ steps.disk.outputs.OSTREE_PATH }}
          DEP:         ${{ steps.disk.outputs.DEP }}
          VAR:         ${{ steps.disk.outputs.VAR }}
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -f /tmp/vm_key -N "" -C "boot-check@gha"
          PUBKEY=$(cat /tmp/vm_key.pub)
          BFT_UID=1001

          sudo ln -sf /usr/lib/systemd/system/sshd.service \
            "${DEP}/etc/systemd/system/multi-user.target.wants/sshd.service"
          sudo ssh-keygen -A -f "${DEP}" 2>/dev/null || true

          if ! sudo grep -q '^bluefin-test:' "${DEP}/etc/passwd" 2>/dev/null; then
            printf 'bluefin-test:x:%d:%d:Bluefin Test:/var/home/bluefin-test:/bin/bash\n' \
              "${BFT_UID}" "${BFT_UID}" | sudo tee -a "${DEP}/etc/passwd"
            printf 'bluefin-test:*:19000:0:99999:7:::\n' | sudo tee -a "${DEP}/etc/shadow"
            printf 'bluefin-test:x:%d:\n' "${BFT_UID}" | sudo tee -a "${DEP}/etc/group"
          fi

          sudo mkdir -p "${DEP}/etc/ssh/sshd_config.d/"
          printf 'PubkeyAuthentication yes\nPermitUserEnvironment yes\nAuthorizedKeysCommand /bin/cat /etc/ssh/ci-authorized-keys\nAuthorizedKeysCommandUser root\n' | \
            sudo tee "${DEP}/etc/ssh/sshd_config.d/00-ci-auth.conf"
          printf '%s\n' "${PUBKEY}" | sudo tee "${DEP}/etc/ssh/ci-authorized-keys"
          sudo chmod 600 "${DEP}/etc/ssh/ci-authorized-keys"

          sudo mkdir -p "${DEP}/etc/tmpfiles.d/"
          printf 'Z /var/home/bluefin-test 0700 %d %d -\nd /var/home/bluefin-test 0700 %d %d -\nd /var/home/bluefin-test/.ssh 0700 %d %d -\n' \
            "${BFT_UID}" "${BFT_UID}" \
            "${BFT_UID}" "${BFT_UID}" \
            "${BFT_UID}" "${BFT_UID}" | \
            sudo tee "${DEP}/etc/tmpfiles.d/ci-user.conf"
          printf 'bluefin-test ALL=(ALL) NOPASSWD:ALL\n' | \
            sudo tee "${DEP}/etc/sudoers.d/bluefin-test"

          sudo mkdir -p "${VAR}/home/bluefin-test/.ssh"
          printf '%s\n' "${PUBKEY}" | \
            sudo tee "${VAR}/home/bluefin-test/.ssh/authorized_keys"
          sudo chmod 700 "${VAR}/home/bluefin-test/.ssh"
          sudo chmod 600 "${VAR}/home/bluefin-test/.ssh/authorized_keys"

          sudo umount /mnt
          sudo losetup -d "${{ steps.disk.outputs.LOOP }}" 2>/dev/null || true

      - name: Boot VM
        env:
          ROOT_UUID:   ${{ steps.disk.outputs.ROOT_UUID }}
          OSTREE_PATH: ${{ steps.disk.outputs.OSTREE_PATH }}
          KVER:        ${{ steps.disk.outputs.KVER }}
        run: |
          set -euo pipefail
          KERNEL_ARGS="root=UUID=${ROOT_UUID} rw ostree=${OSTREE_PATH}"
          KERNEL_ARGS+=' systemd.firstboot=no selinux=0'
          KERNEL_ARGS+=' console=ttyS0,115200 systemd.journald.forward_to_console=1'
          KERNEL_ARGS+=' quiet'
          for svc in tailscaled brew-setup NetworkManager-wait-online firewalld \
              wpa_supplicant flatpak-preinstall podman-auto-update \
              podman-auto-update.timer malcontent-webd malcontent-webd-update \
              malcontent-control speech-dispatcherd avahi-daemon avahi-daemon.socket \
              cups cups.path cups.socket cups.browsed blueman-mechanism \
              gnome-remote-desktop bazzite-hardware-setup \
              greenboot-healthcheck greenboot-set-rollback-trigger \
              systemd-udev-settle; do
            KERNEL_ARGS+=" systemd.mask=${svc}.service"
          done

          touch vm-serial.log && chmod 666 vm-serial.log
          sudo qemu-system-x86_64 \
            -machine  q35,accel=kvm \
            -cpu      host \
            -m        4096 \
            -smp      4 \
            -kernel   ./vmlinuz \
            -initrd   ./initramfs.img \
            -append   "${KERNEL_ARGS}" \
            -object   iothread,id=ioth0 \
            -drive    if=none,id=disk,file=disk.raw,format=raw,cache=unsafe,aio=threads,discard=unmap \
            -device   virtio-blk-pci,drive=disk,iothread=ioth0 \
            -netdev   user,id=net0,hostfwd=tcp::2222-:22 \
            -device   virtio-net-pci,netdev=net0 \
            -display  none \
            -serial   "file:$(pwd)/vm-serial.log" \
            -daemonize \
            -pidfile  /tmp/qemu.pid
          QEMU_PID=$(sudo cat /tmp/qemu.pid)
          echo "VM booting (pid=${QEMU_PID})"

      - name: Wait for SSH
        run: |
          set -euo pipefail
          SSH_OPTS=(-i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=5
            -o UserKnownHostsFile=/dev/null -o BatchMode=yes)
          echo "Waiting for SSH on port 2222..."
          for attempt in $(seq 1 36); do
            if ssh "${SSH_OPTS[@]}" -p 2222 bluefin-test@127.0.0.1 true 2>/dev/null; then
              echo "SSH ready after ~$((attempt * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: SSH did not become reachable within 3 minutes"
          echo "--- last 40 lines of serial log ---"
          tail -40 vm-serial.log || true
          exit 1

      - name: Health checks
        run: |
          set -euo pipefail
          SSH=(ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o BatchMode=yes -p 2222 bluefin-test@127.0.0.1)

          echo "==> systemd multi-user.target"
          for _i in $(seq 1 6); do
            if "${SSH[@]}" sudo systemctl is-active multi-user.target 2>/dev/null; then
              break
            fi
            [[ ${_i} -lt 6 ]] || { echo "ERROR: multi-user.target not active after 60s"; exit 1; }
            echo "  multi-user.target not yet active (attempt ${_i}/6), retrying in 10s…"
            sleep 10
          done

          echo "==> gdm.service"
          if ! GDM_STATE=$("${SSH[@]}" sudo systemctl show gdm.service --property=ActiveState --value 2>/dev/null); then
            echo "ERROR: unable to query gdm.service ActiveState"
            exit 1
          fi
          if [[ -z "${GDM_STATE}" ]]; then
            echo "ERROR: empty gdm.service ActiveState — unit may not exist"
            exit 1
          fi
          echo "GDM state: ${GDM_STATE}"
          if [[ "${GDM_STATE}" == "failed" ]]; then
            echo "ERROR: gdm.service is in failed state — image regression"
            exit 1
          fi

          echo "==> no failed critical units"
          FAILED=$("${SSH[@]}" sudo systemctl list-units --state=failed --no-legend \
            | grep -v 'boot-timeout\|greenboot\|bazzite\|malcontent\|avahi\|cups\|blueman' \
            || true)
          if [[ -n "${FAILED}" ]]; then
            echo "WARNING: failed units:"
            echo "${FAILED}"
          fi
          echo "Boot check passed."

      - name: Cleanup VM
        if: always()
        run: |
          if [[ -f /tmp/qemu.pid ]]; then
            sudo kill "$(sudo cat /tmp/qemu.pid)" 2>/dev/null || true
          fi

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-local-boot-check-serial-${{ github.sha }}
          path: vm-serial.log
          retention-days: 3
          if-no-files-found: ignore

  # ── Promote :testing ─────────────────────────────────────────────────────
  promote:
    needs: [publish, boot-check]
    if: >-
      needs.publish.result == 'success' &&
      needs.boot-check.result == 'success' &&
      github.ref_name == 'testing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promote :${{ github.sha }} to :testing
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          PUSH_OK=false
          for attempt in 1 2 3; do
            skopeo copy \
              --preserve-digests \
              --src-creds "$GH_ACTOR:$GH_TOKEN" \
              --dest-creds "$GH_ACTOR:$GH_TOKEN" \
              "docker://${IMAGE}:${GITHUB_SHA}" \
              "docker://${IMAGE}:testing" && { PUSH_OK=true; break; }
            echo "skopeo copy attempt ${attempt} failed, retrying in 5s..."
            [ "$attempt" -lt 3 ] && sleep 5
          done
          $PUSH_OK || { echo "ERROR: all copy attempts failed for :testing"; exit 1; }
          echo "==> :testing now points at ${GITHUB_SHA}"
